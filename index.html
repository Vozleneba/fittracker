<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Трекер прогресса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, phone-first; the 5-week wave drawn as barbell plates sized by %1RM is the one bold element */
:root{
  --bg:#eceef2; --surface:#ffffff; --surface-2:#f4f5f8; --line:#d5d9e1; --fg:#14171c; --muted:#5b6370;
  --w1:#1f8f54; --w2:#c48e00; --w3:#d4561c; --w4:#c42a3a; --w5:#2f62cf;
  --up:#1f8f54; --hold:#b06a00; --warn:#c42a3a;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --wk:var(--w1);--on-wk:#fff;--leaf:#1f9d55;--on-leaf:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#191c22; --surface-2:#20242c; --line:#2b303a; --fg:#eceef2; --muted:#959dab;
  --w1:#35b874; --w2:#e8b42a; --w3:#f07a3c; --w4:#ef5464; --w5:#5b8bf0; --up:#35b874; --hold:#e0a040; --warn:#ef5464; --leaf:#4fd486; --on-leaf:#06210f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#191c22; --surface-2:#20242c; --line:#2b303a; --fg:#eceef2; --muted:#959dab;
  --w1:#35b874; --w2:#e8b42a; --w3:#f07a3c; --w4:#ef5464; --w5:#5b8bf0; --up:#35b874; --hold:#e0a040; --warn:#ef5464; --leaf:#4fd486; --on-leaf:#06210f; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.45 var(--body);padding:0 16px 130px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:16px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--wk);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

.cycle{display:flex;flex-direction:column;gap:14px}
.cycle-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.cycle h1{font:700 24px/1.12 var(--display);letter-spacing:-.01em}
.cycle h1 span{color:var(--wk-ink)}
.rir{font:600 13px/1.35 var(--body);color:var(--muted)}
.bar{position:relative;display:flex;align-items:center;gap:4px;padding:4px 0}
.bar::before{content:"";position:absolute;left:0;right:0;top:calc(50% - 9px);height:6px;background:var(--line);border-radius:3px}
.plate{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;height:104px;justify-content:center}
.disc{width:20px;border-radius:5px;background:var(--surface-2);border:2px solid var(--line)}
.plate[data-done="1"] .disc{background:var(--c);border-color:var(--c);opacity:.5}
.plate[data-cur="1"] .disc{background:var(--c);border-color:var(--c);opacity:1}
.plate small{font:600 10.5px/1 var(--mono);color:var(--muted);white-space:nowrap}
.plate[data-cur="1"] small{color:var(--fg)}
.wkfacts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wkfacts div{background:var(--surface-2);border-radius:9px;padding:8px;min-width:0}
.wkfacts b{display:block;font:700 14px/1.2 var(--mono)}
.wkfacts span{font-size:11px;color:var(--muted)}
.rot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rot button{font:600 12px/1.25 var(--body);padding:8px 4px;border-radius:9px;background:var(--surface-2);color:var(--muted);text-align:center;border:1px solid transparent;display:flex;flex-direction:column;gap:2px;align-items:center}
.rot button small{font:500 10.5px/1 var(--mono)}
.rot button[data-s="done"]{color:var(--fg)}
.rot button[data-s="done"] b::before{content:"✓ ";color:var(--wk)}
.rot button[data-s="next"]{border-color:var(--wk);color:var(--fg);background:var(--surface)}
.rot button[data-s="missed"]{color:var(--warn)}
.nutri{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.nutri b{color:var(--fg)}
.alert{border-color:var(--warn);color:var(--warn);font-weight:600;font-size:14px}

.next h2{font:700 22px/1.15 var(--display)}
.next .sub{color:var(--muted);margin-top:4px}
.prev-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.prev-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.prev-list li span:first-child{min-width:0}
.prev-list .num{color:var(--muted);white-space:nowrap}
.prev-list .warn{color:var(--warn)}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;border:0;background:var(--wk);color:var(--on-wk);font:700 15px/1 var(--body);margin-top:16px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:13px;margin:0}
.rest{margin-top:10px;font-size:13px;color:var(--muted)}
.rules{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

details.pos summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none}
details.pos summary::-webkit-details-marker{display:none}
details.pos summary::after{content:" ▾"}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pos-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
select,input{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}

.wk-head{display:flex;align-items:center;gap:12px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;flex:none;font-size:18px}
.wk-head h2{font:700 20px/1.15 var(--display)}
.wk-head .rir{margin-top:2px}
.date-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.date-row input{width:auto}
.backpain{display:flex;flex-direction:column;gap:8px}
.backpain .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.backpain .scale button{padding:9px 0;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);font:600 12px var(--mono)}
.backpain .scale button[aria-pressed="true"]{background:var(--wk);border-color:var(--wk);color:var(--on-wk)}
.backpain .scale button[data-hi="1"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.ex{display:flex;flex-direction:column;gap:10px}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex h3{font:700 16px/1.25 var(--body)}
.ex .plan{font-size:13px;color:var(--muted);white-space:nowrap}
.ex .last{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1.3 var(--body);padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.chip[data-t="up"]{color:var(--up)}
.chip[data-t="hold"]{color:var(--hold)}
.chip[data-t="warn"]{color:var(--warn)}
.chip[data-t="deload"]{color:var(--w5)}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:20px minmax(0,1fr) 12px minmax(0,1fr) 62px 44px;align-items:center;gap:5px}
.wu{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;border:1px dashed var(--line)}
.wu-h{display:flex;justify-content:space-between;gap:8px;font:600 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wu-h span:last-child{letter-spacing:0;text-transform:none;font-weight:500}
.wu-row .wr{font:600 14px var(--mono);text-align:center}
.wu-row .pct{font:600 11.5px var(--mono);color:var(--muted);text-align:center}
.wu-row input{padding:8px 4px}
.set.wu-row .tick{height:36px}
.set.wu-row[data-done="1"] .tick{background:var(--wk);border-color:var(--wk);color:var(--on-wk)}
.set.wu-row[data-done="1"] input{border-color:var(--wk-line);background:var(--wk-soft)}
.set.wu-row[data-done="1"] .wr,.set.wu-row[data-done="1"] .i{color:var(--wk-ink)}
.set select{padding:10px 4px;text-align:center;font:600 13px var(--mono)}
.set-head{display:grid;grid-template-columns:20px minmax(0,1fr) 12px minmax(0,1fr) 62px 44px;gap:5px;font:600 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.adv{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px;line-height:1.4}
.adv b{display:block;font:700 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.adv .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 14px var(--mono);color:#fff;background:var(--muted)}
.adv[data-t="up"] .ic{background:var(--up)} .adv[data-t="up"] b{color:var(--up)}
.adv[data-t="down"] .ic{background:var(--hold)} .adv[data-t="down"] b{color:var(--hold)}
.adv[data-t="ok"] .ic{background:var(--wk)} .adv[data-t="ok"] b{color:var(--fg)}
.adv[data-t="warn"] .ic{background:var(--warn)} .adv[data-t="warn"] b{color:var(--warn)}
.set .i{font:600 12px var(--mono);color:var(--muted);text-align:center}
.set .x{color:var(--muted);text-align:center}
.set input{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;padding:10px 4px}
.set input::placeholder{color:var(--muted);opacity:.6}
.tick{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:16px;color:var(--muted)}
.set[data-done="1"] .tick{background:var(--wk);border-color:var(--wk);color:var(--on-wk)}
.set[data-done="1"] input{border-color:var(--wk)}
.rirrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.rirrow select{width:auto;padding:7px 10px}
.ex-actions{display:flex;gap:12px}
.link{background:none;border:0;padding:4px 0;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.hist-item{padding:0;overflow:hidden}
.hist-item summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none}
.hist-item summary::-webkit-details-marker{display:none}
.hist-item .t{font-weight:700}
.hist-item .d{font-size:12.5px;color:var(--muted)}
.wchip{font:700 11px/1 var(--mono);padding:5px 7px;border-radius:6px;color:#fff;white-space:nowrap}
.hist-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.hist-body .row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.hist-body .row span:first-child{min-width:0}
.hist-body .row span:last-child{color:var(--muted);text-align:right}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}

.store{font-size:12px;color:var(--muted);text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;z-index:5}
nav.tabs button{flex:1;max-width:200px;background:none;border:0;padding:10px;border-radius:10px;font-weight:700;color:var(--muted)}
nav.tabs button[aria-current="true"]{background:var(--surface-2);color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
/* streak + calendar */
:root{--fl1:#ffcf4a;--fl2:#ff7a1a;--fl3:#e8261c}
.streak{display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%}
.streak svg{flex:none}
.streak .big{font:700 30px/1 var(--display)}
.streak .lbl{font-size:13px;color:var(--muted);margin-top:4px}
.streak .risk{color:var(--warn);font-weight:600}
.flame-off .f-outer{fill:var(--line)} .flame-off .f-inner{fill:var(--surface-2)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{font:700 18px/1.2 var(--display);text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font:600 11px/1 var(--body);color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.06em}
.cal-cell{position:relative;aspect-ratio:1/1.1;max-width:100%;border-radius:9px;border:1px solid transparent;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;min-width:0}
.cal-cell b{font:600 13px/1 var(--mono)}
.cal-cell i{font:600 8.5px/1 var(--body);font-style:normal;letter-spacing:.02em;white-space:nowrap;overflow:hidden;max-width:100%}
.cal-cell[data-k="out"]{background:transparent;opacity:.3}
.cal-cell[data-k="done"]{background:var(--c);color:#fff}
.cal-cell[data-k="plan"]{border:1.5px dashed var(--c);background:var(--surface)}
.cal-cell[data-k="plan"] i{color:var(--c)}
.cal-cell[data-k="miss"] i{color:var(--warn);text-decoration:line-through}
.cal-cell[data-k="miss"]{border:1.5px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.cal-cell[data-today="1"]{box-shadow:0 0 0 2px var(--fg)}
.cal-cell[aria-pressed="true"]{outline:2px solid var(--wk);outline-offset:2px}
.cal-cell .sf{position:absolute;top:2px;right:2px;width:11px;height:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:12px;height:12px;border-radius:4px;display:inline-block}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mstats div{background:var(--surface-2);border-radius:9px;padding:9px;min-width:0}
.mstats b{display:block;font:700 18px/1.1 var(--mono)}
.mstats span{font-size:11px;color:var(--muted)}
.dayd{display:flex;flex-direction:column;gap:8px}
.dayd h3{font:700 16px/1.25 var(--body)}
/* celebration */
.fire{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px;text-align:center;border:0;width:100%;color:var(--fg)}
/* summary */
.sum-hero{display:flex;flex-direction:column;gap:6px}
.sum-hero .big{font:700 40px/1 var(--display);letter-spacing:-.02em}
.sum-hero .big small{font:600 16px var(--body);color:var(--muted)}
.delta{align-self:flex-start;font:700 12.5px/1 var(--mono);padding:6px 9px;border-radius:7px;background:var(--surface-2)}
.delta[data-t="up"]{color:var(--up)} .delta[data-t="down"]{color:var(--hold)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tiles div{background:var(--surface-2);border-radius:10px;padding:12px;min-width:0}
.tiles b{display:block;font:700 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tiles span{font-size:12px;color:var(--muted)}
.tiles em{font-style:normal;font-size:11.5px;display:block;margin-top:3px}
.tiles em[data-t="ok"]{color:var(--up)} .tiles em[data-t="hi"]{color:var(--hold)}
.prs{display:flex;flex-direction:column;gap:8px}
.pr{display:flex;align-items:center;gap:10px;font-size:14px}
.pr .medal{flex:none;width:28px;height:28px;border-radius:50%;background:linear-gradient(160deg,var(--fl1),var(--fl2));color:#fff;display:grid;place-items:center;font:700 11px var(--mono)}
.extab{width:100%;border-collapse:collapse;font-size:13px}
.extab th{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 0 6px}
.extab td{border-top:1px solid var(--line);padding:8px 8px 8px 0;vertical-align:top}
.extab td.r,.extab th.r{text-align:right;padding-right:0;white-space:nowrap}
.extab .sub{color:var(--muted);font-size:12px}
.foot{font-size:12px;color:var(--muted)}
/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.tm-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.tm-bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
#tm-fill{display:block;height:100%;background:var(--wk);width:0;transition:width .25s linear}
.tm-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tm-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.tm-info b{font:700 30px/1 var(--mono);font-variant-numeric:tabular-nums}
.tm-info span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-btns{display:flex;gap:6px;flex:none}
.tm-btns button{height:42px;min-width:46px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:600 13px var(--mono)}
.timer[data-done="1"] .tm-info b{color:var(--warn)}
.timer[data-done="1"] #tm-fill{background:var(--warn)}
.timer[data-done="1"]{animation:ring 1s ease-in-out 3}
@keyframes ring{50%{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}}
.fire>span{display:block}
.fire canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fire .fl{position:relative;width:150px;height:180px;transform-origin:50% 90%;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both,flick 1.1s ease-in-out .6s infinite alternate}
.fire .n{position:relative;font:700 64px/1 var(--display);margin-top:-6px}
.fire .t{position:relative;font:700 18px/1.3 var(--body)}
.fire .s{position:relative;font-size:14px;color:var(--muted)}
.fire .rec{position:relative;font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--fl3);padding:7px 10px;border-radius:7px}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flick{0%{transform:scale(1) skewX(0)}50%{transform:scale(1.04,.97) skewX(-2deg)}100%{transform:scale(.98,1.04) skewX(2deg)}}
/* accents — every tint is derived from the current week's colour (--wk) */
:root{
  --wk-soft:color-mix(in srgb,var(--wk) 12%,var(--surface));
  --wk-soft2:color-mix(in srgb,var(--wk) 22%,var(--surface));
  --wk-line:color-mix(in srgb,var(--wk) 45%,var(--line));
  --wk-ink:color-mix(in srgb,var(--wk) 78%,var(--fg));
}
.btn{box-shadow:0 8px 20px -10px var(--wk)}
.btn.ghost{box-shadow:none;border-color:var(--wk-line);color:var(--wk-ink)}
nav.tabs{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:color-mix(in srgb,var(--surface) 88%,transparent)}
nav.tabs button[aria-current="true"]{background:var(--wk-soft2);color:var(--wk-ink)}
.card.next{background:linear-gradient(155deg,var(--wk-soft2),var(--surface) 58%);border-color:var(--wk-line)}
.card.next .eyebrow{color:var(--wk-ink)}
.rot button[data-s="next"]{background:var(--wk-soft)}

.chip[data-t="plan"]{background:var(--wk-soft);color:var(--wk-ink)}
/* workout hero */
.wk-hero{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:18px;border:1px solid var(--wk-line);background:radial-gradient(120% 90% at 100% 0%,var(--wk-soft2),transparent 60%),linear-gradient(160deg,var(--wk-soft),var(--surface) 70%)}
.wk-hero .back{background:var(--surface);border-color:var(--wk-line);color:var(--wk-ink)}
.wk-hero h2{font-size:22px}
.wk-hero .eyebrow{color:var(--wk-ink)}
.hero-prog{display:flex;flex-direction:column;gap:6px}
.hero-prog .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.hero-prog .row b{color:var(--wk-ink);font:700 13px var(--mono)}
.hero-bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--wk) 16%,var(--surface-2));overflow:hidden}
#hero-fill{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--wk) 70%,var(--fl1)),var(--wk));transition:width .35s ease}
.wk-hero .date-row input{background:var(--surface)}
/* exercise cards */
.exn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--wk-soft2);color:var(--wk-ink);font:700 12px var(--mono);margin-right:9px;vertical-align:1px;transition:background .2s,color .2s}
.exp{font:700 12px/1 var(--mono);color:var(--wk-ink);background:var(--wk-soft);padding:5px 7px;border-radius:6px;white-space:nowrap}
.ex{transition:border-color .25s,background .25s}
.ex[data-full="1"]{border-color:var(--wk-line);background:linear-gradient(170deg,var(--wk-soft),var(--surface) 50%)}
.ex[data-full="1"] .exn{background:var(--wk);color:var(--on-wk)}
.ex[data-full="1"] .exp{background:var(--wk);color:var(--on-wk)}
.set:not(.wu-row)[data-done="1"] input{background:var(--wk-soft);font-weight:700}
.set:not(.wu-row)[data-done="1"] select{border-color:var(--wk);background:var(--wk-soft)}
.set-head span:nth-child(5){color:var(--wk-ink)}
.tick{transition:background .15s,transform .15s}
.set[data-done="1"] .tick{box-shadow:0 4px 12px -5px var(--wk)}
.tick:active{transform:scale(.92)}
.adv[data-t="ok"]{background:var(--wk-soft)}
.adv[data-t="up"]{background:color-mix(in srgb,var(--up) 11%,var(--surface))}
.adv[data-t="down"]{background:color-mix(in srgb,var(--hold) 11%,var(--surface))}
.adv[data-t="warn"]{background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.wu{border-color:var(--wk-line);background:color-mix(in srgb,var(--wk) 4%,var(--surface))}
.wu-h span:first-child{color:var(--wk-ink)}
/* timer */
.timer{border-top:2px solid var(--wk);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.timer:not([data-done="1"]) .tm-info b{color:var(--wk-ink)}
#tm-fill{background:linear-gradient(90deg,color-mix(in srgb,var(--wk) 70%,var(--fl1)),var(--wk))}
.timer:not([data-done="1"]) #tm-x{background:var(--wk);border-color:var(--wk);color:var(--on-wk)}
/* streak, calendar, history, summary */
.streak{background:linear-gradient(115deg,color-mix(in srgb,var(--fl2) 14%,var(--surface)),var(--surface) 62%);border-color:color-mix(in srgb,var(--fl2) 35%,var(--line))}
.cal-head h2{color:var(--wk-ink)}
.cal-nav button{border-color:var(--wk-line);color:var(--wk-ink);background:var(--wk-soft)}
.mstats div:first-child{background:var(--wk-soft)} .mstats div:first-child b{color:var(--wk-ink)}
.cal-cell[data-k="done"]{box-shadow:0 6px 14px -9px var(--c)}
.hist-item[open]{border-color:var(--wk-line)}
.hist-item[open] summary{background:var(--wk-soft)}
.hist-item .t{display:flex;align-items:center;gap:8px}
.hist-item .t::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--wk))}
.sum-hero{border-color:var(--wk-line);background:radial-gradient(120% 100% at 100% 0%,var(--wk-soft2),transparent 60%),linear-gradient(160deg,var(--wk-soft),var(--surface) 70%)}
.sum-hero .eyebrow{color:var(--wk-ink)}
.sum-hero .big{color:var(--wk-ink)}
.tiles div{background:var(--surface);border:1px solid var(--line)}
.tiles div:nth-child(-n+2){background:var(--wk-soft);border-color:var(--wk-line)}
.tiles div:nth-child(-n+2) b{color:var(--wk-ink)}
.extab th{color:var(--wk-ink)}
.extab td.r{font-weight:700}
h1[data-accent]{color:var(--wk-ink)}
/* story */
.story-wrap{display:flex;justify-content:center}
.story-wrap[data-t="sticker"] #story-img{aspect-ratio:1080/860;width:100%;background:repeating-conic-gradient(#3a3f48 0 25%,#2a2e35 0 50%) 0 0/24px 24px}
#story-img{width:min(100%,340px);aspect-ratio:9/16;border-radius:20px;background:var(--surface-2);box-shadow:0 20px 50px -24px var(--wk);border:1px solid var(--wk-line);object-fit:cover}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{padding:10px 6px;border-radius:9px;border:0;background:transparent;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--wk);color:var(--on-wk);box-shadow:0 6px 14px -8px var(--wk)}
/* правка истории */
.he-wrap{display:flex;flex-direction:column;gap:10px}
.he-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:6px}
.he-actions .btn{margin:0}
.he{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.he:first-child{border-top:0;padding-top:0}
.he-n{font-weight:700;font-size:14px}
.he-row{display:grid;grid-template-columns:18px minmax(0,1fr) 10px minmax(0,1fr) 60px 38px;gap:5px;align-items:center}
.he-row select{padding:9px 2px;text-align:center;font:600 13px var(--mono)}
.he-add{align-self:flex-start;color:var(--wk-ink)}
.he-addex{padding-top:10px;border-top:1px solid var(--line)}
.he-row .i{font:600 12px var(--mono);color:var(--muted);text-align:center}
.he-row .x{color:var(--muted);text-align:center}
.he-row input{text-align:center;font-family:var(--mono);padding:9px 4px}
.he-row .tick{height:38px;font-size:18px}
/* свёртки без <details> */
.dt-sum{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.dt-sum:focus-visible{outline:2px solid var(--wk);outline-offset:2px;border-radius:12px}
.dt:not([data-open="1"])>.dt-body{display:none!important}
.card.pos>.dt-sum{font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.card.pos>.dt-sum::after{content:"▾";transition:transform .2s}
.card.pos[data-open="1"]>.dt-sum::after{transform:rotate(180deg)}
.hist-item>.dt-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.hist-item[data-open="1"]{border-color:var(--wk-line)}
.hist-item[data-open="1"]>.dt-sum{background:var(--wk-soft)}
.hist-item>.dt-body{padding:12px 16px 14px}
.hist-body .row:first-child{border-top:0;padding-top:0}
.nc-day>.dt-sum{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nc-day>.dt-sum h3{margin:0;flex:1}
.nc-day>.dt-sum .nc-meta{font:600 12px var(--mono);color:var(--muted)}
.nc-day>.dt-sum::after{content:"▾";color:var(--muted);transition:transform .2s}
.nc-day[data-open="1"]>.dt-sum::after{transform:rotate(180deg)}
.nc-day[data-open="1"]>.dt-sum{margin-bottom:6px}
/* список упражнений следующей тренировки */
.nx{margin-top:14px}
.nx-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--wk-soft);border:1px solid var(--wk-line);color:var(--wk-ink);font-weight:700;font-size:13.5px}
.nx-hint{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px}
.nx-hint::after{content:"▾";transition:transform .2s}
.nx[data-open="1"] .nx-hint::after{transform:rotate(180deg)}
.nx .prev-list{margin-top:6px}
/* карточка следующего цикла */
.ncc{display:grid;grid-template-columns:48px minmax(0,1fr) 36px;grid-template-areas:"ic txt go" "bar bar bar" "cap cap cap";align-items:center;gap:12px 14px;text-align:left;width:100%;padding:16px}
.ncc-ic{grid-area:ic;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--wk-soft2);color:var(--wk-ink);box-shadow:0 0 0 1px var(--wk-line) inset}
.ncc-ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ncc-txt{grid-area:txt;display:flex;flex-direction:column;gap:3px;min-width:0}
.ncc-eb{font:700 10.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ncc[data-ready="1"] .ncc-eb{color:var(--wk-ink)}
.ncc-txt b{font:700 19px/1.15 var(--display);letter-spacing:-.01em}
.ncc-sub{font-size:13px;color:var(--muted)}
.ncc-go{grid-area:go;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--wk-ink);background:var(--surface-2);border:1px solid var(--line)}
.ncc[data-ready="1"] .ncc-go{background:var(--wk);color:var(--on-wk);border-color:var(--wk);box-shadow:0 8px 18px -10px var(--wk)}
.ncc-bar{grid-area:bar;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ncc-seg{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;box-shadow:0 0 0 1px var(--line) inset}
.ncc-seg i{display:block;height:100%;background:var(--c);border-radius:3px}
.ncc-cap{grid-area:cap;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-4px}
.ncc-cap b{font:700 12px var(--mono);color:var(--fg)}
.th{display:inline-block;width:.16em}
/* подтверждения */
.cbox{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh);animation:cbIn .18s ease-out}
.cbox[data-danger="1"]{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--warn) 9%,var(--surface)),var(--surface))}
.cbox-t{display:flex;flex-direction:column;gap:4px}
.cbox-t b{font-size:16px}
.cbox-t span{font-size:13.5px;color:var(--muted)}
.cbox-b{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.cbox-b .btn{margin:0}
.cbox[data-danger="1"] .cbox-yes{background:linear-gradient(180deg,color-mix(in srgb,#fff 12%,var(--warn)),var(--warn));color:#fff;box-shadow:0 10px 24px -12px var(--warn)}
@keyframes cbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.prev-list .up{color:var(--up)} .prev-list .down{color:var(--hold)}
/* план тренировки в календаре */
.pp-sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.pp-sum b{font:700 13px var(--mono);color:var(--fg)}
.pp{display:flex;flex-direction:column}
.pp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.pp-row:first-child{border-top:0}
.pp-n{display:flex;flex-direction:column;gap:2px;min-width:0}
.pp-n b{font-size:14px}
.pp-n span{font-size:12px;color:var(--muted)}
.pp-n em{font-style:normal;font-weight:700}
.pp-n em[data-t="up"]{color:var(--up)} .pp-n em[data-t="down"]{color:var(--hold)}
.pp-v{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.pp-v b{font-size:14.5px;color:var(--wk-ink)}
.pp-v span{font-size:12px;color:var(--muted)}
/* общий таймер тренировки */
.tm-top{display:flex;align-items:center;gap:10px}
.tm-top .tm-bar{flex:1}
.tm-total{flex:none;font:700 12.5px var(--mono);color:var(--fg);padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.timer[data-mode="total"]{border-top-color:var(--line)}
.timer[data-mode="total"] .tm-top,.timer[data-mode="total"] .tm-btns{display:none}
.timer[data-mode="total"] .tm-in{gap:0}
.timer[data-mode="total"] .tm-info b{font-size:22px;color:var(--fg)}
.timer[data-mode="total"] .tm-row{min-height:40px}
/* вес */
.w-card{display:flex;flex-direction:column;gap:12px}
.w-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.w-big{font:700 40px/1 var(--display);margin-top:8px;letter-spacing:-.02em}
.w-big small{font:600 15px var(--body);color:var(--muted)}
.w-delta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.w-delta b{font-size:16px}
.w-delta span{font-size:11.5px;color:var(--muted)}
.w-delta[data-t="up"] b{color:var(--up)} .w-delta[data-t="warn"] b{color:var(--warn)} .w-delta[data-t="hold"] b{color:var(--hold)}
.w-verdict{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:12px;border-left:3px solid var(--muted);background:var(--surface-2)}
.w-verdict[data-t="up"]{border-color:var(--up)} .w-verdict[data-t="warn"]{border-color:var(--warn)} .w-verdict[data-t="hold"]{border-color:var(--hold)}
.w-seg{grid-template-columns:repeat(2,1fr)}
.wchart{width:100%;height:auto;display:block;touch-action:manipulation}
.wchart .wg{stroke:var(--line);stroke-width:1}
.wchart .wt{fill:var(--muted);font:500 10px var(--mono)}
.wchart .wl{fill:none;stroke:var(--wk);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.wchart .wd{fill:var(--muted);stroke:var(--surface);stroke-width:2;opacity:.75}
.wchart .wd.on{fill:var(--fg);opacity:1}
.wchart .wx{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.w-tip{font-size:12.5px;color:var(--muted);text-align:center;min-height:18px}
.w-tip b{color:var(--fg)}
.w-leg{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted)}
.w-leg span{display:inline-flex;align-items:center;gap:6px}
.w-leg .ld{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.w-leg .ll{width:16px;height:3px;border-radius:2px;background:var(--wk)}
.w-empty{font-size:13px;color:var(--muted);text-align:center;padding:24px 8px;border:1px dashed var(--line);border-radius:12px}
.w-weeks{display:flex;flex-direction:column;gap:6px}
.w-row{display:grid;grid-template-columns:1fr auto 64px;gap:10px;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line)}
.w-row span:nth-child(3){text-align:right;font-weight:700}
.w-row [data-t="down"]{color:var(--up)} .w-row [data-t="up"]{color:var(--hold)}
/* питание */
.fd-card{display:flex;flex-direction:column;gap:12px}
.mb-wrap{display:flex;flex-direction:column;gap:10px}
.ml-card{display:flex;flex-direction:column;gap:12px}
.ml-list{display:flex;flex-direction:column;gap:8px}
.ml{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--fg);font:inherit;cursor:pointer;transition:background .2s,border-color .2s}
.ml[aria-pressed="true"]{background:color-mix(in srgb,var(--leaf) 13%,var(--surface));border-color:color-mix(in srgb,var(--leaf) 55%,var(--line))}
.ml-sum b{color:var(--leaf)}
.ml-head{display:flex;flex-direction:column;gap:12px}
.ml-body{display:flex;flex-direction:column;gap:12px}
.ml-dots{display:flex;align-items:center;gap:6px}
.ml-dots i{flex:1;height:6px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.ml-dots i[data-on="1"]{background:var(--leaf);border-color:var(--leaf)}
.ml-chev{font:600 12px var(--body);color:var(--muted);margin-left:6px;white-space:nowrap}
.ml-chev::after{content:" ▾";display:inline-block}
.ml-card[data-open="1"] .ml-chev::after{transform:rotate(180deg)}
.ml-ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:all .2s}
.ml[aria-pressed="true"] .ml-ck{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.ml-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ml-l{font:700 10.5px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ml[aria-pressed="true"] .ml-l{color:var(--leaf)}
.ml-t b{font-size:15px}
.ml-i{font-size:12.5px;color:var(--muted)}
.ml-i em{font-style:normal;color:var(--leaf);font-weight:700}
.ml-k{font-weight:700;font-size:15px;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.ml-k small{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.mb-t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.mb-t b{color:var(--fg);font-size:13px}
.mb-t small{color:var(--muted);font-weight:500}
.mb-bar{position:relative;height:8px;border-radius:4px;background:var(--surface-2);overflow:visible}
.mb-bar span{display:block;height:100%;border-radius:4px;background:var(--muted)}
.mb-bar[data-s="ok"] span{background:var(--up)} .mb-bar[data-s="under"] span{background:var(--hold)} .mb-bar[data-s="over"] span{background:var(--warn)}
.mb-bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.35;border-radius:1px}
.fd-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fd-in label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);min-width:0}
.fd-in input{text-align:center;font-family:var(--mono);padding:10px 4px}
/* калькулятор */
.cq{display:flex;flex-direction:column;gap:10px}
.cq-l{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.cf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.cf input{font-family:var(--mono);font-size:15px}
.cq .seg button{font-size:12.5px;padding:10px 4px}
#calc-res{display:flex;flex-direction:column;gap:12px}
.cr-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cr-mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cr-mac div{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--surface-2);min-width:0}
.cr-mac b{font:700 22px var(--display);color:var(--wk-ink)}
.cr-mac span{font-size:11.5px;color:var(--muted)}
.cr-mac em{font-style:normal;font:600 11.5px var(--mono);color:var(--fg)}
/* swap */
.swap-btn{color:var(--wk-ink)}
.swap{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--wk-line);border-radius:12px;background:var(--wk-soft)}
.swap-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.swap-opt b{font-weight:600;font-size:14px;min-width:0}
.swap-opt span{font-size:12px;color:var(--muted);white-space:nowrap}
.swap-opt[aria-pressed="true"]{border-color:var(--wk);box-shadow:inset 0 0 0 1px var(--wk)}
/* readiness */
.rq{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.rq:first-of-type{border-top:0}
.rq-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rq-top b{font-size:15px}
.rq-top span{font-size:12px;color:var(--muted);text-align:right}
.rq-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rq-scale button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:700 15px var(--mono)}
.rq-scale button[aria-pressed="true"]{background:var(--wk);border-color:var(--wk);color:var(--on-wk);box-shadow:0 6px 14px -8px var(--wk)}
.rq-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.dict{display:flex;flex-direction:column;gap:8px}
.dict textarea{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:76px;resize:vertical;width:100%}
.zone{display:flex;gap:14px;align-items:center}
.zone .ring{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font:700 18px var(--mono);background:conic-gradient(var(--zc) calc(var(--p)*1%),var(--surface-2) 0);position:relative}
.zone .ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.zone .ring span{position:relative}
.zone b{display:block;font-size:16px}
.zone p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);text-align:left;width:100%}
.toggle i{flex:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--wk)}
.toggle[aria-pressed="true"] i::after{transform:translateX(16px)}
/* activity */
.steps-big{font:700 40px/1 var(--display);color:var(--wk-ink)}
.steps-big small{font:600 15px var(--body);color:var(--muted)}
.stbar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.stbar span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--wk) 70%,var(--fl1)),var(--wk))}
.row-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-in input,.row-in select{flex:1;min-width:90px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{padding:8px 12px;border-radius:9px;border:1px solid var(--wk-line);background:var(--wk-soft);color:var(--wk-ink);font:600 13px var(--mono)}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;position:relative;padding-top:8px}
.wk7 .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--wk-line);pointer-events:none}
.wk7 .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.wk7 .b{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--surface-2);min-height:3px}
.wk7 .b[data-hit="1"]{background:var(--wk)}
.wk7 .b[data-sel="1"]{outline:2px solid var(--fg);outline-offset:1px}
.wk7 small{font:600 10px/14px var(--mono);height:14px;color:var(--muted)}
.cardio-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.datebar{display:flex;align-items:center;gap:8px}
.datebar b{flex:1;text-align:center;font:700 15px var(--body);text-transform:capitalize}
.datebar button{width:38px;height:38px;border-radius:10px;border:1px solid var(--wk-line);background:var(--wk-soft);color:var(--wk-ink);font-size:16px}
.cal-cell .stp{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--up)}
.cal-cell[data-k="done"] .stp{background:#fff}
.act-mini{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.act-mini .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.act-mini .top b{font:700 18px var(--mono);color:var(--wk-ink)}
.act-mini .top span{font-size:12.5px;color:var(--muted)}
/* next cycle */
.nc-day{display:flex;flex-direction:column;gap:4px}
.nc-day h3{font:700 15px/1.2 var(--body);color:var(--wk-ink);margin-bottom:4px}
.nc-row{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-top:1px solid var(--line)}
.nc-row .t{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.nc-row .t span:first-child{min-width:0}
.nc-row .d{font:600 12.5px var(--mono);white-space:nowrap}
.nc-row .d[data-t="up"]{color:var(--up)} .nc-row .d[data-t="down"]{color:var(--hold)} .nc-row .d[data-t="flat"]{color:var(--muted)}
.nc-row .w{font:500 12.5px var(--mono);color:var(--fg)}
.nc-row .src{font-size:11.5px;color:var(--muted)}
.ncw{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ncw span{text-align:center;padding:5px 2px;border-radius:6px;background:var(--surface-2);font:600 12px var(--mono)}
.ncw span em{display:block;font-style:normal;font-size:9.5px;color:var(--muted);font-weight:500}
/* ================= PREMIUM LAYER =================
   Направление: «графит и мел» — тёмный графит, мелкое зерно как на резиновом покрытии зала,
   металл грифа и блины как фирменный знак; цвет недели — единственный яркий акцент. */
:root{
  --bg:#eef0f3;--surface:#ffffff;--surface-2:#f3f4f7;--line:#dfe2e8;--fg:#121418;--muted:#626a77;
  --hi:rgba(255,255,255,.9);--sh:0 1px 2px rgba(18,20,24,.05),0 8px 24px -12px rgba(18,20,24,.12);
  --steel1:#c9ced6;--steel2:#8b939f;--steel3:#e9ecf0;--grain:.035;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0c0f;--surface:#14161b;--surface-2:#1b1e24;--line:#262a32;--fg:#eef0f4;--muted:#8f97a5;
  --hi:rgba(255,255,255,.05);--sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -18px rgba(0,0,0,.8);
  --steel1:#3a3f48;--steel2:#22262d;--steel3:#5a616d;--grain:.06}}
:root[data-theme="dark"]{
  --bg:#0b0c0f;--surface:#14161b;--surface-2:#1b1e24;--line:#262a32;--fg:#eef0f4;--muted:#8f97a5;
  --hi:rgba(255,255,255,.05);--sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -18px rgba(0,0,0,.8);
  --steel1:#3a3f48;--steel2:#22262d;--steel3:#5a616d;--grain:.06}
body{background:var(--bg);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;left:-20%;right:-20%;top:-30vh;height:70vh;pointer-events:none;z-index:0;
  background:radial-gradient(50% 50% at 70% 50%,color-mix(in srgb,var(--wk) 16%,transparent),transparent 70%)}
.wrap{position:relative;z-index:1;gap:14px}
.card{border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,var(--hi),transparent 40%),var(--surface);box-shadow:var(--sh)}
.eyebrow{display:inline-flex;align-items:center;gap:7px}
h1,h2,h3{letter-spacing:-.015em}
/* кнопки */
.btn{border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,#fff 14%,var(--wk)),var(--wk));box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 10px 24px -12px var(--wk);font-weight:800;letter-spacing:.01em;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;box-shadow:none}
/* герой цикла: гриф с насечкой, втулки и блины с металлом */
.cycle h1{font-size:25px}
.bar{height:120px;padding:0 4px;margin-top:2px}
.bar::before{top:calc(50% - 12px);height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--steel1) 0 2px,var(--steel2) 2px 4px);box-shadow:0 1px 0 var(--hi) inset}
.bar::after{content:"";position:absolute;left:-2px;top:calc(50% - 20px);width:12px;height:24px;border-radius:3px;background:linear-gradient(180deg,var(--steel3),var(--steel1))}
.plate{height:120px}
.disc{width:22px;border-radius:6px;border:0;background:linear-gradient(90deg,var(--steel2),var(--steel1) 45%,var(--steel2));box-shadow:0 0 0 1px var(--line) inset}
.plate[data-done="1"] .disc{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#000),var(--c) 45%,color-mix(in srgb,var(--c) 55%,#000));opacity:.45}
.plate[data-cur="1"] .disc{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 60%,#000),color-mix(in srgb,var(--c) 70%,#fff) 40%,var(--c) 55%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 0 26px -2px var(--c);opacity:1}
.plate small{font-size:10px}
.wkfacts div,.mstats div,.tiles div{border-radius:14px}
.wkfacts b{font-size:13.5px;white-space:nowrap}
.rot button{border-radius:12px;padding:9px 4px}
.rot button[data-s="next"]{box-shadow:0 0 0 1px var(--wk) inset,0 8px 18px -12px var(--wk);border-color:transparent}
/* навигация — плавающая капсула с иконками */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:24px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 82%,transparent);box-shadow:0 18px 40px -18px rgba(0,0,0,.55);max-width:520px;margin:0 auto}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:18px;font-size:11px;font-weight:700;letter-spacing:.01em}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{background:var(--wk-soft2);color:var(--wk-ink)}
.toast{bottom:calc(150px + env(safe-area-inset-bottom,0px));border-radius:14px}
.timer{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;border:1px solid var(--wk-line);border-top:2px solid var(--wk);box-shadow:0 18px 40px -16px rgba(0,0,0,.6);padding:12px 14px}
/* тренировка: выполненные упражнения сворачиваются */
.ex-top h3{display:flex;align-items:center;min-width:0}
.ex[data-full="1"]:not([data-open="1"])>*:not(.ex-top){display:none}
.ex[data-full="1"]:not([data-open="1"]){padding-block:12px}
.ex[data-full="1"] .ex-top{cursor:pointer}
.ex-sum{display:none;font:600 12.5px var(--mono);color:var(--wk-ink);margin-top:-2px}
.ex[data-full="1"]:not([data-open="1"]) .ex-sum{display:block}
.set input,.set select,.tick{border-radius:11px}
.chip{border-radius:9px}
/* бейджи недели: тёмный текст на светлых цветах */
.wchip{color:#fff}
.wchip[data-w="2"],.wchip[data-w="3"]{color:#1a1206}
/* следующий цикл: дни сворачиваются */
details.nc-day>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.nc-day>summary::-webkit-details-marker{display:none}
details.nc-day>summary h3{margin:0;flex:1}
details.nc-day>summary .nc-meta{font:600 12px var(--mono);color:var(--muted)}
details.nc-day>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
details.nc-day[open]>summary::after{transform:rotate(180deg)}
details.nc-day[open]>summary{margin-bottom:6px}
.nc-top{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
.nc-top b{font:700 13px var(--mono);text-align:right}

/* ================= GLASS LAYER =================
   Жидкое стекло: полупрозрачные карточки с размытием над мягким цветным свечением,
   заливки — тонированное стекло с бликом сверху вместо плоских плашек; цвета — глубокие «драгоценные» тона. */
:root{
  --w1:#08a566;--w2:#e0a000;--w3:#f0620f;--w4:#e3201b;--w5:#2a5bff;
  --up:#08a566;--hold:#d98a00;--warn:#e3201b;--leaf:#08a566;--on-leaf:#fff;
  --g-card:color-mix(in srgb,#ffffff 66%,transparent);--g-edge:rgba(255,255,255,.85);--g-line:rgba(20,30,25,.08);
  --neutral:#6b7480;--g-hi:rgba(255,255,255,.95);--g-tint:38%;--g-tint2:16%;--g-glow:.22;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --w1:#1fe08f;--w2:#ffc414;--w3:#ff7614;--w4:#ff3a2e;--w5:#5c82ff;
  --up:#1fe08f;--hold:#ffab1a;--warn:#ff3a2e;--leaf:#1fe08f;--on-leaf:#04170e;
  --g-card:color-mix(in srgb,#161a20 62%,transparent);--g-edge:rgba(255,255,255,.10);--g-line:rgba(255,255,255,.07);
  --neutral:#a7b0bb;--g-hi:rgba(255,255,255,.14);--g-tint:40%;--g-tint2:15%;--g-glow:.34}}
:root[data-theme="dark"]{
  --w1:#1fe08f;--w2:#ffc414;--w3:#ff7614;--w4:#ff3a2e;--w5:#5c82ff;
  --up:#1fe08f;--hold:#ffab1a;--warn:#ff3a2e;--leaf:#1fe08f;--on-leaf:#04170e;
  --g-card:color-mix(in srgb,#161a20 62%,transparent);--g-edge:rgba(255,255,255,.10);--g-line:rgba(255,255,255,.07);
  --neutral:#a7b0bb;--g-hi:rgba(255,255,255,.14);--g-tint:40%;--g-tint2:15%;--g-glow:.34}
/* цветное свечение за стеклом */
body::after{inset:0;left:0;right:0;top:0;height:auto;
  background:radial-gradient(60% 40% at 85% 0%,color-mix(in srgb,var(--glow-top,var(--glow,var(--wk))) calc(var(--g-glow)*100%),transparent),transparent 70%),
             radial-gradient(50% 35% at 0% 45%,color-mix(in srgb,var(--glow,var(--wk)) calc(var(--g-glow)*55%),transparent),transparent 70%),
             radial-gradient(60% 40% at 100% 100%,color-mix(in srgb,var(--glow,var(--wk)) calc(var(--g-glow)*40%),transparent),transparent 70%)}
/* стеклянные карточки */
.card,.cbox{background:linear-gradient(180deg,var(--g-hi),transparent 38%),var(--g-card);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--g-line);box-shadow:inset 0 1px 0 var(--g-edge),0 18px 40px -26px rgba(0,0,0,.45)}
nav.tabs,.timer{background:var(--g-card);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--g-line);box-shadow:inset 0 1px 0 var(--g-edge),0 20px 44px -18px rgba(0,0,0,.55)}
.mstats div,.tiles div,.w-delta,.seg,.ml,.wkfacts div{background:color-mix(in srgb,var(--surface-2) 55%,transparent);border-color:var(--g-line)}
/* тонированное стекло вместо плоской заливки */
.btn,.seg button[aria-pressed="true"],.rq-scale button[aria-pressed="true"],.backpain .scale button[aria-pressed="true"],
.set[data-done="1"] .tick,.set.wu-row[data-done="1"] .tick,.ex[data-full="1"] .exn,.ex[data-full="1"] .exp,
.timer:not([data-done="1"]) #tm-x,.ncc[data-ready="1"] .ncc-go,nav.tabs button[aria-current="true"],
.quick button,.datebar button,.mstats div:first-child,.tiles div:nth-child(-n+2),.ml[aria-pressed="true"]{
  --gc:var(--wk);
  background:linear-gradient(160deg,color-mix(in srgb,var(--gc) var(--g-tint),transparent),color-mix(in srgb,var(--gc) var(--g-tint2),transparent));
  color:color-mix(in srgb,var(--gc) 90%,var(--fg));
  border:1px solid color-mix(in srgb,var(--gc) 38%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent),inset 0 -8px 16px -12px color-mix(in srgb,var(--gc) 60%,transparent),0 10px 24px -16px var(--gc);
  -webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%)}
.btn{font-weight:800}
.btn.ghost{background:transparent;box-shadow:inset 0 1px 0 var(--g-edge);border:1px solid color-mix(in srgb,var(--wk) 30%,var(--g-line));color:color-mix(in srgb,var(--wk) 80%,var(--fg))}
.mstats div:first-child b,.tiles div:nth-child(-n+2) b{color:inherit}
.ml[aria-pressed="true"]{--gc:var(--leaf)}
.ml[aria-pressed="true"] .ml-ck{background:linear-gradient(160deg,color-mix(in srgb,#fff 25%,var(--leaf)),var(--leaf));border-color:transparent;color:var(--on-leaf);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px -4px var(--leaf)}
.ml-dots i[data-on="1"]{background:linear-gradient(90deg,var(--leaf),color-mix(in srgb,#fff 25%,var(--leaf)));box-shadow:0 0 10px -2px var(--leaf)}
/* календарь: выполненный день — стекло цвета недели */
.cal-cell[data-k="done"]{--gc:var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 42%,transparent),color-mix(in srgb,var(--c) 16%,transparent));
  color:color-mix(in srgb,var(--c) 70%,var(--fg));border:1px solid color-mix(in srgb,var(--c) 50%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 18px -10px var(--c)}
.cal-cell[data-k="done"] .stp{background:currentColor}
.wk7 .b[data-hit="1"]{background:linear-gradient(180deg,color-mix(in srgb,#fff 20%,var(--wk)),var(--wk));box-shadow:0 0 12px -3px var(--wk)}
#tm-fill,.ncc-seg i{background:linear-gradient(90deg,var(--wk),color-mix(in srgb,#fff 25%,var(--wk)))}
.ncc-seg i{background:linear-gradient(90deg,var(--c),color-mix(in srgb,#fff 25%,var(--c)))}
.wchip{background-image:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 60%)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.cbox[data-danger="1"] .cbox-yes{
  background:linear-gradient(160deg,color-mix(in srgb,var(--warn) 40%,transparent),color-mix(in srgb,var(--warn) 16%,transparent));
  color:color-mix(in srgb,var(--warn) 82%,var(--fg));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent),inset 0 -8px 16px -12px var(--warn),0 10px 24px -14px var(--warn)}
.cbox[data-danger="1"]{background:linear-gradient(180deg,color-mix(in srgb,var(--warn) 14%,transparent),transparent 60%),var(--g-card);border-color:color-mix(in srgb,var(--warn) 35%,var(--g-line))}
/* счётчик недель цикла: стеклянная дорожка, глянцевая заливка */
.ncc-seg{height:8px;border-radius:9px;background:color-mix(in srgb,var(--surface-2) 60%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 1px var(--g-line)}
.ncc-seg i{border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 60%),linear-gradient(90deg,color-mix(in srgb,var(--c) 85%,#000),var(--c) 60%,color-mix(in srgb,#fff 25%,var(--c)));box-shadow:0 0 12px -2px var(--c)}
/* блины на грифе: пройденные недели — стекло цвета недели, текущая — с бликом и свечением */
.plate[data-done="1"] .disc{opacity:1;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 70%,transparent) 45%,color-mix(in srgb,var(--c) 30%,transparent));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent),0 0 16px -6px var(--c)}
.plate[data-cur="1"] .disc{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 45%),linear-gradient(90deg,color-mix(in srgb,var(--c) 65%,#000),color-mix(in srgb,var(--c) 75%,#fff) 40%,var(--c) 55%,color-mix(in srgb,var(--c) 65%,#000))}

/* ===== Стрик: стеклянная капсула с огнём */
.card.streak{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:16px;overflow:hidden;position:relative;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--fl2) 22%,transparent),transparent 55%),linear-gradient(180deg,var(--g-hi),transparent 38%),var(--g-card);
  border-color:color-mix(in srgb,var(--fl2) 28%,var(--g-line))}
.card.streak[data-on="0"]{background:linear-gradient(180deg,var(--g-hi),transparent 38%),var(--g-card);border-color:var(--g-line)}
.sk-top{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.sk-orb{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;position:relative;
  background:radial-gradient(70% 70% at 50% 65%,color-mix(in srgb,var(--fl2) 45%,transparent),color-mix(in srgb,var(--fl3) 12%,transparent) 70%);
  border:1px solid color-mix(in srgb,var(--fl1) 40%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 28px -10px var(--fl2)}
.streak[data-on="0"] .sk-orb{background:color-mix(in srgb,var(--surface-2) 60%,transparent);border-color:var(--g-line);box-shadow:inset 0 1px 0 var(--g-edge)}
.sk-orb svg{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--fl2) 70%,transparent))}
.streak[data-on="0"] .sk-orb svg{filter:none;opacity:.55}
.flame .f-mid,.flame .f-inner{transform-box:fill-box;transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite}
.flame .f-inner{animation-duration:1.7s;animation-delay:-.4s}
@keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.96,1.05)}70%{transform:scale(1.03,.97)}}
.flame-off .f-outer{fill:color-mix(in srgb,var(--muted) 35%,transparent)} .flame-off .f-mid{fill:color-mix(in srgb,var(--muted) 25%,transparent)}
.flame-off .f-inner,.flame-off .f-shine{fill:color-mix(in srgb,var(--muted) 18%,transparent)}
.flame-off .f-mid,.flame-off .f-inner{animation:none}
.sk-main{min-width:0}
.sk-num{display:flex;align-items:center;gap:9px}
.sk-num b{font:700 38px/1 var(--display);letter-spacing:-.03em;background:linear-gradient(180deg,var(--fl1),var(--fl2) 55%,var(--fl3));-webkit-background-clip:text;background-clip:text;color:transparent}
.streak[data-on="0"] .sk-num b{background:none;color:var(--fg)}
.sk-num span{font:700 12px/1.15 var(--body);color:var(--fg);text-transform:uppercase;letter-spacing:.06em}
.streak .lbl{font-size:13px;color:var(--muted);margin-top:6px}
.sk-rec{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--surface-2) 55%,transparent);border:1px solid var(--g-line);box-shadow:inset 0 1px 0 var(--g-edge)}
.sk-rec span{font:600 9.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sk-rec b{font:700 18px var(--display)}
.sk-foot{display:flex;align-items:center;gap:12px}
.sk-chain{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.sk-chain i,.sk-fuel i{height:6px;border-radius:9px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);box-shadow:inset 0 0 0 1px var(--g-line)}
.sk-chain i[data-on="1"]{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 60%),linear-gradient(90deg,var(--fl3),var(--fl2) 50%,var(--fl1));box-shadow:0 0 10px -3px var(--fl2)}
.sk-fuel{display:flex;gap:3px;padding-left:12px;border-left:1px solid var(--g-line)}
.sk-fuel{align-items:center}.sk-fuel span{font:600 9.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:3px}.sk-fuel i{width:14px}
.sk-fuel i[data-on="1"]{background:color-mix(in srgb,var(--fl1) 75%,transparent);box-shadow:0 0 8px -2px var(--fl1)}
@media (prefers-reduced-motion:reduce){.flame .f-mid,.flame .f-inner{animation:none}}

/* главная: блины и дни недели кликабельны */
.cycle{--wk-soft:color-mix(in srgb,var(--wk) 12%,var(--surface));--wk-soft2:color-mix(in srgb,var(--wk) 22%,var(--surface));--wk-line:color-mix(in srgb,var(--wk) 45%,var(--line));--wk-ink:color-mix(in srgb,var(--wk) 78%,var(--fg))}
button.plate{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.plate:focus-visible{outline:2px solid var(--wk);outline-offset:3px;border-radius:8px}
button.plate[data-now="1"] small{color:var(--fg);font-weight:700}
button.plate[data-now="1"] small::after{content:" •";color:var(--wk)}
.cycle .cycle-top{flex-wrap:nowrap;align-items:flex-start}
.ct-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none;padding:2px 0 6px;align-self:stretch}
.ct-r .rir{margin-top:auto}
.hback{font:700 12px var(--body);white-space:nowrap;padding:7px 11px;border-radius:999px;cursor:pointer;color:color-mix(in srgb,var(--wk) 85%,var(--fg));
  background:linear-gradient(160deg,color-mix(in srgb,var(--wk) 30%,transparent),color-mix(in srgb,var(--wk) 10%,transparent));border:1px solid color-mix(in srgb,var(--wk) 45%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.rot button[aria-pressed="true"]{outline:2px solid var(--wk);outline-offset:1px}
.hdet{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--wk) 10%,transparent),transparent 45%),color-mix(in srgb,var(--surface-2) 55%,transparent);border:2px solid color-mix(in srgb,var(--wk) 70%,transparent);box-shadow:inset 0 1px 0 var(--g-edge),0 10px 26px -14px var(--wk)}
.hdet-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.hdet-h span{font-size:12.5px;color:var(--muted)}
.hist-item{--wk-soft:color-mix(in srgb,var(--wk) 12%,var(--surface));--wk-soft2:color-mix(in srgb,var(--wk) 22%,var(--surface));--wk-line:color-mix(in srgb,var(--wk) 45%,var(--line));--wk-ink:color-mix(in srgb,var(--wk) 78%,var(--fg))}
.hist-item .wchip,.wchip[style*="--c"]{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 38%,transparent),color-mix(in srgb,var(--c) 14%,transparent))!important;
  color:color-mix(in srgb,var(--c) 75%,var(--fg))!important;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px -8px var(--c)}
.wu-act{display:flex;gap:16px;padding-top:4px}
.wu-act .link{font-size:13px}
/* редактор плана питания */
.me{display:flex;flex-direction:column;gap:12px}
.me-tot{position:sticky;margin-inline:-4px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:3;padding:12px 14px;border-radius:16px;background:var(--g-card);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid color-mix(in srgb,var(--leaf) 35%,var(--g-line));box-shadow:inset 0 1px 0 var(--g-edge),0 12px 26px -18px rgba(0,0,0,.6)}
#me-day{font-size:14px;margin-top:6px}
#me-day b{font:700 20px var(--display);color:var(--leaf)}
.me-meal{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--surface-2) 55%,transparent);border:1px solid var(--g-line)}
.me-mh{display:flex;justify-content:space-between;align-items:center}
.me-mh .link{font-size:12px;color:var(--warn)}
.me-name{font:700 15px var(--body);padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.me-it{display:grid;grid-template-columns:minmax(0,1fr) 84px 58px 28px;gap:6px;align-items:center}
.me-it select{min-width:0;font:500 13px var(--body);padding:9px 6px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.me-q{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding-right:7px}
.me-q input{width:100%;min-width:0;border:0;background:none;padding:9px 0 9px 9px;font:600 14px var(--mono);color:var(--fg);outline:none}
.me-q span{font-size:11px;color:var(--muted)}
.me-ik{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.me-x{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--muted);font-size:16px;line-height:1}
.me-mt{font-size:13px;padding-top:8px;border-top:1px dashed var(--line)}
.me-mt b{font-size:15px}
.me-d{font:600 12px var(--mono)} .me-d[data-s="up"]{color:var(--hold)} .me-d[data-s="down"]{color:var(--leaf)} .me-d[data-s="eq"]{color:var(--muted)}
.me-d0{font-size:12px;color:var(--muted)}
.me-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.me-cf{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--leaf) 45%,var(--line))}
.me-cf input{font:500 14px var(--body);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:0;width:100%}
.me-cfg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.me-cfg label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
/* подсказки «?» */
.qh{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;vertical-align:middle;border-radius:50%;padding:0;
  border:1px solid var(--g-line);background:color-mix(in srgb,var(--surface-2) 70%,transparent);color:var(--muted);font:700 11px/1 var(--body);letter-spacing:0;text-transform:none;cursor:pointer;flex:none;box-shadow:inset 0 1px 0 var(--g-edge)}
.qh[data-on],[data-act="qh"][data-on] .qh,.qh:focus-visible{color:var(--fg);outline:none;border-color:color-mix(in srgb,var(--leaf) 65%,transparent);background:color-mix(in srgb,var(--leaf) 30%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 10px -2px var(--leaf)}
.tipbox{white-space:pre-line;position:fixed;z-index:60;padding:12px 14px;border-radius:14px;font:500 13px/1.45 var(--body);color:var(--fg);
  background:linear-gradient(180deg,var(--g-hi),transparent 40%),color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--g-line);box-shadow:inset 0 1px 0 var(--g-edge),0 18px 40px -14px rgba(0,0,0,.6)}
.ml-mac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ml-m{display:flex;flex-direction:column;gap:4px;min-width:0}
.ml-m span{font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ml-m b{font:700 16px var(--mono);white-space:nowrap}
.ml-m b small{font-size:11px;color:var(--muted);font-weight:500}
.ml-m i{display:block;height:6px;border-radius:9px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);box-shadow:inset 0 0 0 1px var(--g-line);overflow:hidden}
.ml-m em{display:block;height:100%;border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 60%),linear-gradient(90deg,color-mix(in srgb,var(--leaf) 80%,#000),var(--leaf));box-shadow:0 0 10px -2px var(--leaf)}
.ml-dots{justify-content:flex-end}
.ml-sum{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--surface-2) 55%,transparent);border:1px solid var(--g-line);min-width:110px}
.ml-sum b{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--leaf);letter-spacing:-.02em}
.ml-sum span{font:500 12px var(--body);color:var(--muted);white-space:nowrap}
.st-top{display:flex;justify-content:space-between;align-items:center}
.st-goal{background:none;border:0;padding:0;font:600 12.5px var(--body);color:var(--muted);cursor:pointer}
.st-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,auto);gap:6px;align-items:stretch}
.st-in{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.st-in input{flex:1;min-width:0;border:0;background:none;padding:11px 0 11px 12px;font:600 15px var(--mono);color:var(--fg);outline:none}
.st-in button{width:36px;height:36px;margin:3px;border-radius:9px;border:0;cursor:pointer;font:700 16px var(--body);
  background:linear-gradient(160deg,color-mix(in srgb,var(--leaf) 40%,transparent),color-mix(in srgb,var(--leaf) 16%,transparent));color:color-mix(in srgb,var(--leaf) 90%,var(--fg));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.st-q{padding:0 11px;border-radius:12px;cursor:pointer;font:700 13px var(--mono);color:color-mix(in srgb,var(--leaf) 90%,var(--fg));
  background:linear-gradient(160deg,color-mix(in srgb,var(--leaf) 26%,transparent),color-mix(in srgb,var(--leaf) 9%,transparent));border:1px solid color-mix(in srgb,var(--leaf) 38%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.w-card.dt{display:flex;flex-direction:column;gap:12px}
.w-head{display:flex;flex-direction:column;gap:12px}
.w-body{display:flex;flex-direction:column;gap:12px}
.w-foot{justify-content:space-between}
.w-today{font:500 13px var(--body);color:var(--muted)} .w-today b{color:var(--fg);font-weight:700}
.w-head .w-top{align-items:flex-start}
.w-chg{--c:var(--hold);display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:999px;flex:none;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 20%,transparent),color-mix(in srgb,var(--c) 6%,transparent));
  border:1px solid color-mix(in srgb,var(--c) 32%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.w-chg[data-t="up"]{--c:var(--leaf)} .w-chg[data-t="warn"]{--c:var(--warn)}
.w-chg b{font:700 13px/1 var(--body);color:color-mix(in srgb,var(--c) 88%,var(--fg));white-space:nowrap;font-variant-numeric:tabular-nums}
.w-chg small{font:600 11px/1 var(--body);color:var(--muted);white-space:nowrap}
.w-chg .qh{margin-left:0;width:16px;height:16px;font-size:10px}
.ncc-bar:has(.ncc-one){display:block}
.ncc-one{display:block;height:8px;border-radius:9px;background:color-mix(in srgb,var(--surface-2) 60%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 1px var(--g-line)}
.ncc-one i{display:block;height:100%;border-radius:9px;transition:width .4s}
/* следующий цикл — нейтральный, лёгкий зелёный акцент */
.ncc .ncc-ic{background:color-mix(in srgb,var(--surface-2) 60%,transparent);color:var(--fg);box-shadow:inset 0 1px 0 var(--g-edge),0 0 0 1px var(--g-line)}
.ncc{--wk:var(--neutral);--wk-soft:color-mix(in srgb,var(--neutral) 10%,var(--surface));--wk-soft2:color-mix(in srgb,var(--neutral) 18%,var(--surface));--wk-line:color-mix(in srgb,var(--neutral) 35%,var(--line));--wk-ink:var(--fg)}
.ncc[data-ready="1"] .ncc-go,.btn[data-act="ncask"],.cbox .cbox-yes[data-act="ncgo"]{--gc:var(--leaf)}
.ncc[data-ready="1"] .ncc-eb{color:color-mix(in srgb,var(--leaf) 85%,var(--fg))}
.card.cycle{border-color:color-mix(in srgb,var(--wk) 55%,transparent);box-shadow:inset 0 1px 0 var(--g-edge),0 0 0 1px color-mix(in srgb,var(--wk) 18%,transparent),0 18px 44px -26px var(--wk)}
.nc-info{display:flex;align-items:center;gap:4px;padding:12px 14px;border-radius:16px;font:500 13px var(--body);color:var(--muted);background:color-mix(in srgb,var(--surface-2) 55%,transparent);border:1px solid var(--g-line)}
.wk-hero.nc-hero{border-color:color-mix(in srgb,var(--leaf) 60%,transparent);box-shadow:inset 0 1px 0 var(--g-edge),0 0 0 1px color-mix(in srgb,var(--leaf) 16%,transparent),0 18px 44px -26px var(--leaf)}
.card.next.neu .btn{--gc:var(--cur)}
.card.next.neu{--wk:var(--neutral);--wk-soft:color-mix(in srgb,var(--neutral) 8%,var(--surface));--wk-soft2:color-mix(in srgb,var(--neutral) 14%,var(--surface));--wk-line:color-mix(in srgb,var(--neutral) 30%,var(--line));--wk-ink:var(--fg);--on-wk:var(--bg)}
.mstats div:first-child{background:color-mix(in srgb,var(--surface-2) 55%,transparent);border:1px solid var(--g-line);color:var(--fg);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.mstats div{border:1px solid var(--g-line)}
/* карта-маршрут */
:root{--map-road:#e3e7ec;--map-hole:#c9ced6;--map-hole-line:#aab2bc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--map-road:#262a32;--map-hole:#07080a;--map-hole-line:#3a4048}}
:root[data-theme="dark"]{--map-road:#262a32;--map-hole:#07080a;--map-hole-line:#3a4048}
.cmap{margin:22px 0 2px}
.cmap svg{display:block;overflow:visible}
.map-wl{font:700 9.5px var(--body);fill:var(--muted);cursor:pointer}
.map-wl[data-on="1"]{fill:var(--fg)}
.map-sm{font:600 9px var(--body);fill:var(--muted)}
.map-glow{filter:blur(6px);opacity:.85}
.map-pt[data-vw="0"][data-st="fut"]{opacity:.75}
.map-hole .map-flag{transition:transform .25s ease}
.map-hole.sel .map-flag{transform:translateY(-6px)}
.hdet-h{cursor:pointer}
.hdet-h>span{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none}
.hdet-h>b{min-width:0}
.hd-chev{font:600 12px var(--body);color:var(--muted)}
.hd-chev::after{content:" ▾";display:inline-block;transition:transform .2s}
.hdet[data-open="1"] .hd-chev::after{transform:rotate(180deg)}
/* блин-циферблат */
:root{--dial-face:radial-gradient(#fff,#eee)}
.cdial{margin:16px 0 4px}
.cdial svg{display:block;overflow:visible}
.cdial circle[fill="var(--dial-face)"]{fill:color-mix(in srgb,var(--surface-2) 80%,transparent)}
.dial-big{font:800 14px var(--display);fill:var(--fg);letter-spacing:-.02em}
.dial-w{font:800 12px var(--body);fill:var(--fg)}
.dial-p{font:600 11.5px var(--body);fill:var(--muted)}
.dial-c{font:700 11.5px var(--mono);fill:var(--muted)}
.dial-row[data-on="0"] .dial-w{fill:color-mix(in srgb,var(--fg) 75%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.h-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.h-acts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px 9px;border-radius:14px;border:1px solid var(--g-edge,var(--line));background:var(--g-card,var(--surface-2));color:var(--fg);font:600 11.5px var(--sans,system-ui);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);cursor:pointer;min-width:0}
.h-acts button svg{width:18px;height:18px;color:var(--wk-ink,var(--wk))}
.h-acts button.d,.h-acts button.d svg{color:#ff5a4e}
.h-acts button:active{transform:scale(.96)}
.fx{display:flex;flex-direction:column;gap:8px;margin:4px 0 2px}
.fx-it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--g-edge,var(--line));background:var(--g-card,var(--surface-2))}
.fx-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.fx-t b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fx-t span{font-size:11.5px;color:var(--muted)}
.fx-k{display:flex;flex-direction:column;align-items:flex-end;font-weight:700}.fx-k small{font-size:10.5px;color:var(--muted);font-weight:600}
.fx-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fx-acts button{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 6px;border-radius:14px;border:1px solid var(--g-edge,var(--line));background:var(--g-card,var(--surface-2));color:var(--fg);font:600 13px var(--sans,system-ui);cursor:pointer}
.fx-acts svg{width:17px;height:17px;color:var(--leaf,var(--wk))}
.fx-panel{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--g-edge,var(--line));background:var(--g-card,var(--surface-2))}
.fx-panel textarea{min-height:70px}
.fx-g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.fx-g label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}.fx-g input{min-width:0;padding:8px 6px;text-align:center}
